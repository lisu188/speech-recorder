name: Build Speech Recorder Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'

      - name: Install Android 17 SDK
        run: android sdk install platforms/android-37.0 build-tools/37.0.0

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare unsigned artifact
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk SpeechRecorder-release-unsigned.apk

      - name: Check release signing configuration
        id: signing
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign and verify release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.p12
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks release.p12 \
            --ks-type PKCS12 \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out SpeechRecorder-release.apk \
            SpeechRecorder-release-unsigned.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs SpeechRecorder-release.apk
          rm -f release.p12

      - uses: actions/upload-artifact@v4
        with:
          name: SpeechRecorder-Release-Unsigned
          path: SpeechRecorder-release-unsigned.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: SpeechRecorder-Release-Signed
          path: SpeechRecorder-release.apk
          if-no-files-found: error
