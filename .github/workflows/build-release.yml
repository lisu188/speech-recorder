name: Build Speech Recorder Release

on:
  push:
    branches:
      - main
      - feature/**
      - build/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools

      - name: Install Android 17 SDK
        run: android sdk install platforms/android-37.0 build-tools/37.0.0

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare artifact
        run: cp app/build/outputs/apk/release/app-release.apk SpeechRecorder-1.4.0-release-installable.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpeechRecorder-1.4.0-Installable-Release
          path: SpeechRecorder-1.4.0-release-installable.apk
          if-no-files-found: error
